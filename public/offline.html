<!doctype html>
<html lang="id">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#2563EB" />
        <title>Offline</title>
        <style>
            body {
                margin: 0;
                font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
                background: #f8fafc;
                color: #0f172a;
                display: grid;
                min-height: 100dvh;
                place-items: center;
                padding: 24px;
            }
            .card {
                width: 100%;
                max-width: 420px;
                background: #ffffff;
                border: 1px solid #e2e8f0;
                border-radius: 14px;
                padding: 20px;
                box-shadow: 0 1px 2px rgba(15, 23, 42, 0.06);
            }
            h1 {
                margin: 0;
                font-size: 18px;
                font-weight: 700;
            }
            p {
                margin: 8px 0 0;
                font-size: 14px;
                color: #475569;
                line-height: 1.45;
            }
        </style>
    </head>
    <body>
        <div class="card">
            <h1>Tidak ada koneksi internet</h1>
            <p>Periksa koneksi Anda, lalu coba muat ulang halaman.</p>
        </div>
    </body>
</html>
